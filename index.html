(function(){var bar=document.getElementById('tbar');if(!bar)return;var KEY='s5_tbo',DEF=['un','fx','fu','rc','mm','pd','nm','cb','p2','py','ar','tr','xl','lb','bk','hs'];

<script>
/*ARCHIVE*/(function(){
